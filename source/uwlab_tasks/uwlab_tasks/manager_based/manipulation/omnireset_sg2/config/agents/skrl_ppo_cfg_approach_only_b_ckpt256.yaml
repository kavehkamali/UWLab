#
# Same as PegApproachOnly-B hyperparameters, but **policy/value MLP width 256×256** to match checkpoints
# saved before the B net was widened to 384×384. Use for `play.py --agent ...` when loading those .pt files.
#
# Current default B training uses `skrl_ppo_cfg_approach_only_b.yaml` (384×384).

seed: 43

models:
  separate: false
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 24
  learning_epochs: 7
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 6.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.09
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: false
  experiment:
    directory: "omnireset_ffw_sg2_peg_approach_only_b"
    experiment_name: ""
    write_interval: 24
    checkpoint_interval: 2400

trainer:
  class: SequentialTrainer
  timesteps: 96000
  environment_info: log
